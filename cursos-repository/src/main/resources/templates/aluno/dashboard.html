<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, 'Meus Cursos')}">
<body>
<th:block th:fragment="content">
    <h2 class="mb-4"><i class="bi bi-journal-bookmark me-2 text-primary"></i>Meus Cursos</h2>

    <div th:if="${#lists.isEmpty(matriculas)}" class="text-center text-muted py-5">
        <i class="bi bi-emoji-smile display-4"></i>
        <p class="mt-3 fs-5">Você ainda não foi matriculado em nenhum curso.</p>
        <p>Fale com seu instrutor para começar a estudar!</p>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4" th:unless="${#lists.isEmpty(matriculas)}">
        <div class="col" th:each="mat : ${matriculas}">
            <div class="card h-100 shadow-sm border-primary border-top border-3">
                <div class="card-body">
                    <h5 class="card-title" th:text="${mat.cursoTitulo}">Curso</h5>
                    <p class="text-muted small mb-0"
                       th:text="'Matriculado em ' + ${#temporals.format(mat.matriculadoEm, 'dd/MM/yyyy')}"></p>
                </div>
                <div class="card-footer bg-transparent d-flex gap-2">
                    <a th:href="@{/aluno/cursos/{id}(id=${mat.cursoId})}" class="btn btn-sm btn-primary">
                        <i class="bi bi-play-circle me-1"></i>Acessar
                    </a>
                    <a th:href="@{/forum/curso/{id}(id=${mat.cursoId})}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-chat-dots me-1"></i>Fórum
                    </a>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
