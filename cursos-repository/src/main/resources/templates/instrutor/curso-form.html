<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, 'Curso')}">
<body>
<th:block th:fragment="content">
    <div class="d-flex align-items-center mb-4 gap-2">
        <a th:href="@{/instrutor}" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h2 class="mb-0" th:text="${curso.id == null} ? 'Novo Curso' : 'Editar Curso'">Curso</h2>
    </div>

    <div class="card shadow-sm" style="max-width: 640px;">
        <div class="card-body">
            <form th:action="@{/instrutor/cursos/salvar}" th:object="${curso}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Título *</label>
                    <input type="text" class="form-control" th:field="*{titulo}"
                           th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{titulo}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Descrição</label>
                    <textarea class="form-control" rows="3" th:field="*{descricao}"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-semibold">Categoria</label>
                        <input type="text" class="form-control" th:field="*{categoria}"
                               placeholder="Ex: Programação, Design...">
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-semibold">Carga Horária (h)</label>
                        <input type="number" class="form-control" th:field="*{cargaHoraria}" min="1">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-floppy me-1"></i>Salvar
                    </button>
                    <a th:href="@{/instrutor}" class="btn btn-outline-primary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</th:block>
</body>
</html>
