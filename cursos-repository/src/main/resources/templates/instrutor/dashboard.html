<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, 'Painel do Instrutor')}">
<body>
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-collection-play me-2 text-primary"></i>Meus Cursos</h2>
        <a th:href="@{/instrutor/cursos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Novo Curso
        </a>
    </div>

    <div th:if="${#lists.isEmpty(cursos)}" class="text-center text-muted py-5">
        <i class="bi bi-inbox display-4"></i>
        <p class="mt-2">Você ainda não criou nenhum curso.</p>
        <a th:href="@{/instrutor/cursos/novo}" class="btn btn-outline-primary">
            <i class="bi bi-plus-lg me-1"></i>Criar meu primeiro curso
        </a>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4" th:unless="${#lists.isEmpty(cursos)}">
        <div class="col" th:each="curso : ${cursos}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${curso.titulo}">Título</h5>
                    <p class="card-text text-muted small"
                       th:text="${#strings.abbreviate(curso.descricao ?: '', 100)}"></p>
                    <div class="d-flex flex-wrap gap-2 mt-2">
                        <span class="badge bg-verde" th:if="${curso.categoria}" th:text="${curso.categoria}"></span>
                        <span class="badge bg-light text-dark border" th:if="${curso.cargaHoraria != null}"
                              th:text="${curso.cargaHoraria} + 'h'"></span>
                    </div>
                </div>
                <div class="card-footer bg-transparent d-flex gap-2">
                    <a th:href="@{/instrutor/cursos/{id}(id=${curso.id})}" class="btn btn-sm btn-primary">
                        <i class="bi bi-gear me-1"></i>Gerenciar
                    </a>
                    <a th:href="@{/instrutor/cursos/{id}/editar(id=${curso.id})}"
                       class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form th:action="@{/instrutor/cursos/{id}/excluir(id=${curso.id})}" method="post"
                          class="ms-auto" onsubmit="return confirm('Excluir este curso e todo seu conteúdo?')">
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
