<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, 'Login')}">
<body>
<th:block th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <i class="bi display-3 text-primary"
                   th:classappend="${tipo == 'INSTRUTOR'} ? 'bi-person-video3' : 'bi-person'"></i>
                <h3 th:text="${tipo == 'INSTRUTOR'} ? 'Portal do Instrutor' : 'Portal do Aluno'">Portal</h3>
                <p class="text-muted">Entre com suas credenciais</p>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="${tipo == 'INSTRUTOR'} ? @{/instrutor/login} : @{/aluno/login}"
                          method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">E-mail</label>
                            <input type="email" name="email" class="form-control" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Senha</label>
                            <input type="password" name="senha" class="form-control" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-3">
                <p class="text-muted mb-1">
                    Não tem conta?
                    <a th:href="${tipo == 'INSTRUTOR'} ? @{/instrutor/cadastro} : @{/aluno/cadastro}">
                        Cadastre-se
                    </a>
                </p>
                <a th:href="@{/}" class="text-muted small">
                    <i class="bi bi-arrow-left me-1"></i>Voltar à página inicial
                </a>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
