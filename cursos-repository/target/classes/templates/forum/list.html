<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, 'Fórum')}">
<body>
<th:block th:fragment="content">
    <div class="d-flex align-items-center mb-4 gap-2">
        <a th:if="${session.usuario.tipo == 'INSTRUTOR'}"
           th:href="@{/instrutor/cursos/{id}(id=${curso.id})}" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <a th:if="${session.usuario.tipo == 'ALUNO'}"
           th:href="@{/aluno/cursos/{id}(id=${curso.id})}" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <small class="text-muted" th:text="${curso.titulo}"></small>
            <h2 class="mb-0"><i class="bi bi-chat-dots me-2 text-primary"></i>Fórum</h2>
        </div>
    </div>

    <!-- Novo tópico -->
    <div class="card shadow-sm mb-4">
        <div class="card-header"><i class="bi bi-plus-circle me-1"></i>Novo Tópico</div>
        <div class="card-body">
            <form th:action="@{/forum/curso/{id}/topico/salvar(id=${curso.id})}" method="post"
                  th:object="${novoTopico}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Título *</label>
                    <input type="text" class="form-control" th:field="*{titulo}"
                           th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'"
                           placeholder="Assunto do tópico">
                    <div class="invalid-feedback" th:errors="*{titulo}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mensagem *</label>
                    <textarea class="form-control" rows="3" th:field="*{conteudo}"
                              th:classappend="${#fields.hasErrors('conteudo')} ? 'is-invalid'"
                              placeholder="Descreva sua dúvida ou comentário..."></textarea>
                    <div class="invalid-feedback" th:errors="*{conteudo}"></div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-send me-1"></i>Publicar Tópico
                </button>
            </form>
        </div>
    </div>

    <!-- Lista de tópicos -->
    <div th:if="${#lists.isEmpty(topicos)}" class="text-center text-muted py-4">
        <i class="bi bi-chat display-4"></i>
        <p class="mt-2">Nenhum tópico ainda. Seja o primeiro a postar!</p>
    </div>

    <div class="list-group" th:unless="${#lists.isEmpty(topicos)}">
        <a th:each="t : ${topicos}"
           th:href="@{/forum/topico/{id}(id=${t.id})}"
           class="list-group-item list-group-item-action d-flex gap-3 py-3">
            <div class="flex-shrink-0">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
                     style="width:40px;height:40px;font-size:1.1rem;">
                    <i class="bi"
                       th:classappend="${t.autorTipo == 'INSTRUTOR'} ? 'bi-person-video3' : 'bi-person'"></i>
                </div>
            </div>
            <div class="flex-grow-1 overflow-hidden">
                <div class="d-flex justify-content-between">
                    <h6 class="mb-1 text-truncate" th:text="${t.titulo}"></h6>
                    <small class="text-muted text-nowrap ms-2"
                           th:text="${#temporals.format(t.criadoEm, 'dd/MM/yyyy')}"></small>
                </div>
                <p class="mb-1 text-muted small text-truncate" th:text="${t.conteudo}"></p>
                <small class="text-muted">
                    <span th:text="${t.autorNome}"></span>
                    <span class="badge bg-verde ms-1" th:if="${t.autorTipo == 'INSTRUTOR'}">Instrutor</span>
                </small>
            </div>
        </a>
    </div>
</th:block>
</body>
</html>
