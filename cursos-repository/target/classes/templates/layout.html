<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, titulo)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} ?: 'CursoLar'">CursoLar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-verde">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-house-heart-fill me-2"></i>CursoLar
        </a>

        <div class="d-flex align-items-center gap-3" th:if="${session.usuario != null}">
            <a class="nav-link text-white"
               th:href="${session.usuario.tipo == 'INSTRUTOR'} ? @{/instrutor} : @{/aluno}">
                <i class="bi bi-house-door me-1"></i>Painel
            </a>
            <span class="text-white-50">
                <i class="bi me-1"
                   th:classappend="${session.usuario.tipo == 'INSTRUTOR'} ? 'bi-person-video3' : 'bi-person'"></i>
                <span th:text="${session.usuario.nome}"></span>
                <span class="badge bg-verde ms-1"
                      th:text="${session.usuario.tipo == 'INSTRUTOR'} ? 'Instrutor' : 'Aluno'"></span>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i>Sair
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:replace="${content}">Conteúdo da página</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
